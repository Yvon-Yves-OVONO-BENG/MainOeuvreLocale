# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  # ici vos autres variables
  app.locales: [en, fr]
  app.jwtsecret: "%env(JWT_SECRET)%"
  profile_upload_dir: "%kernel.project_dir%/public/uploads/profiles"
  cv_upload_dir: "%kernel.project_dir%/public/uploads/cv"
  cni_upload_dir: "%kernel.project_dir%/public/uploads/cni"
  portfolio_directory: "%kernel.project_dir%/public/uploads/portfolio"
  mercure_public_url: "%env(string:MERCURE_PUBLIC_URL)%"
  app.stripe_public_key: '%env(STRIPE_PUBLIC_KEY)%'
  app.stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
  app.stripe_currency: 'xaf'
  app.contact_to_email: 'support@maindoeuvrelocale.com'
  app.contact_from_email: 'no-reply@maindoeuvrelocale.com'
  professions_photos_directory: '%kernel.project_dir%/public/uploads/professions'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  App\Service\FichierService: ~
  App\Service\GenererBulletinDePaieService: ~
  App\Service\FavoriteRemover: ~
  App\Security\CurrentUser: ~
  App\Security\ConversationAccess: ~
  App\Realtime\MercurePublisher: ~
  App\Service\ConversationFactory: ~
  App\Service\ProfilCompletionService: ~
  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  App\Security\UserChecker:
    tags:
      - { name: "security.user_checker" }
  App\Controller\Web\:
    resource: "../src/Controller/Web/"
    tags: ["controller.service_arguments"]

  App\Twig\AppExtension:
    tags: [twig.extension]
  App\Twig\AgoExtension:
    tags: ["twig.extension"]

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones

  App\Service\FileUploader:
    arguments:
      $profileDir: "%profile_upload_dir%"
      $cniDir: '%cni_upload_dir%'
  App\Service\CvUploader:
    arguments:
      $targetDir: "%cv_upload_dir%"
  App\Service\PortfolioUploader:
    arguments:
      $targetDir: "%portfolio_directory%"
  App\Service\BoostStripeCardService:
    arguments:
      $stripePublicKey: '%app.stripe_public_key%'
  Stripe\StripeClient:
    arguments:
      $config: '%app.stripe_secret_key%'

  App\Service\BoostStripeIntentService:
    arguments:
      $currency: '%app.stripe_currency%'
  App\Service\PortfolioService:
    arguments:
      $portfolioDirectory: '%portfolio_directory%'

  App\EventListener\SessionIdleListener:
    arguments:
        $maxIdleTime: 1800  # 30 minutes
    tags:
        - { name: kernel.event_subscriber }
